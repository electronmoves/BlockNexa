<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>BlockNexa Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--card:#111C2E;--elev:#182438;--border:#263449;--text:#F8FAFC;--text2:#94A3B8;--primary:#10B981;--primary-hover:#059669;--on-primary:#04231A;--accent:#6488F5;--accent-soft:#B8C7FF;--success:#34D399;--error:#F87171;--font:'Figtree',system-ui,sans-serif;--display:'Sora','Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;background-image:radial-gradient(900px 500px at 90% -10%,rgba(100,136,245,.14),transparent 60%)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.brand{font:700 18px var(--display);display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent))}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}
.mut,small{color:var(--text2);font-size:13px}
input,textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.btn{padding:11px 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700}.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--elev);color:var(--text);border:1px solid var(--border)}.btn.ghost:hover{border-color:var(--accent)}.btn.danger{background:var(--error);color:#2a0606}
.btn.block{display:block;width:100%;margin-top:10px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .card{width:100%;max-width:380px;padding:26px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:260px;display:flex;gap:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;gap:16px}@media(min-width:900px){.cols{grid-template-columns:1fr 340px;align-items:start}}
aside{display:grid;gap:14px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head h2{font:700 22px var(--display)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.chip{padding:7px 13px;border-radius:999px;background:var(--elev);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)}.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:8px}.row:hover{border-color:var(--accent)}
.row .t{width:78px;font-weight:700;font-size:13px}.t.buy{color:var(--success)}.t.sell{color:var(--accent)}.t.withdraw{color:var(--accent-soft)}
.row .m{flex:1;min-width:0}.row .m b{font-family:var(--display);font-size:14px}.row .m small{display:block;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}.success{background:rgba(52,211,153,.15);color:var(--success)}.failed{background:rgba(248,113,113,.15);color:var(--error)}.pending{background:rgba(184,199,255,.14);color:var(--accent-soft)}
.big{font:700 34px var(--display);margin:6px 0 12px}.big small{color:var(--primary);font-size:16px}
.kv{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:14px}.kv div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}.kv div:last-child{border:0}.kv span{color:var(--text2);flex:none}.kv b{text-align:right;word-break:break-all}
.link{color:var(--accent);background:none;padding:0;font-weight:700;text-decoration:underline}
.why{color:var(--error)}.empty{text-align:center;color:var(--text2);padding:30px}
.mdl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,20,.72);backdrop-filter:blur(6px)}
.mcard{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;max-height:92vh;overflow:auto}.mcard h3{font:700 20px var(--display);margin-bottom:8px}.mcard p{margin:8px 0;line-height:1.5;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.merr{color:var(--error);font-weight:600;font-size:14px;margin-top:8px}
.mbtns{display:flex;gap:10px;margin-top:16px}.mbtns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--elev);border:1px solid var(--border);padding:12px 18px;border-radius:14px;font-weight:600;z-index:70}.toast.bad{border-color:var(--error);color:var(--error)}
/* Userbase table */
.ub-wrap{overflow-x:auto;margin-top:14px}
.ub-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ub-table th{text-align:left;padding:10px 14px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.ub-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.ub-table tr:last-child td{border-bottom:0}
.ub-table tr:hover td{background:var(--elev)}
.uid-link{color:var(--accent);background:none;padding:0;font-weight:700;text-decoration:underline;cursor:pointer}
.deact-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(248,113,113,.15);color:var(--error)}
.active-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(52,211,153,.15);color:var(--success)}
.ub-pages{display:flex;gap:8px;align-items:center;margin-top:14px}
/* Deactivation modal overlay animation */
@keyframes mdlIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
#mdl:not([hidden]) .mcard{animation:mdlIn .28s cubic-bezier(.2,1.25,.35,1)}
/* hover on nav buttons */
.btn.ghost{transition:border-color .2s,background .2s,transform .18s,box-shadow .18s}
.btn.ghost:hover{border-color:var(--accent);background:rgba(100,136,245,.1);transform:translateY(-2px);box-shadow:0 6px 18px -8px rgba(100,136,245,.4)}
.btn:not(.ghost):not(.danger){transition:background .2s,transform .18s,box-shadow .18s}
.btn:not(.ghost):not(.danger):hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(16,185,129,.5)}
.btn.danger{transition:background .2s,transform .18s,box-shadow .18s}
.btn.danger:hover{background:#e05555;transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(248,113,113,.4)}
.row{transition:border-color .2s,transform .18s}
.row:hover{border-color:var(--accent);transform:translateX(3px)}
</style></head><body>
<div id="login"><div class="card"><div class="brand"><span class="mark"></span>BlockNexa Admin</div>
  <p class="mut" style="margin:14px 0 12px">Enter your admin key to continue.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="off" aria-label="Admin key">
  <p class="merr" id="lerr" role="alert"></p><button class="btn block" id="enter">Enter</button></div></div>
<div id="panel" hidden><div class="wrap">
  <div class="bar"><div class="brand"><span class="mark"></span>Admin</div>
    <form class="search" id="sf"><input id="q" placeholder="Search a user ID, order ID, UTR, phone or email" aria-label="Search"><button class="btn">Search</button></form>
    <div class="nav"><button class="btn ghost" id="nPending">Pending</button><button class="btn ghost" id="nUsers">Userbase</button><button class="btn ghost" id="nAudit">Admin log</button><button class="btn ghost" id="nBackup">Backup</button><button class="btn ghost" id="nLock">Lock</button></div></div>
  <main id="main"><p class="empty">Search for a user or an order to begin, or open Pending.</p></main></div></div>
<div class="mdl" id="mdl" hidden><div class="mcard" id="mcard"></div></div>
<script src="bn-admin.js"></script>
</body></html>
