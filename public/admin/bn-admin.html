<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>BlockNexa Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--card:#111C2E;--elev:#182438;--border:#263449;--text:#F8FAFC;--text2:#94A3B8;--primary:#10B981;--primary-hover:#059669;--on-primary:#04231A;--accent:#6488F5;--accent-soft:#B8C7FF;--success:#34D399;--error:#F87171;--font:'Figtree',system-ui,sans-serif;--display:'Sora','Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;background-image:radial-gradient(900px 500px at 90% -10%,rgba(100,136,245,.14),transparent 60%)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:0}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.brand{font:700 18px var(--display);display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent))}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}
.mut,small{color:var(--text2);font-size:13px}
input,textarea,select{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;width:100%;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.btn{padding:11px 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700}.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--elev);color:var(--text);border:1px solid var(--border)}.btn.ghost:hover{border-color:var(--accent)}.btn.danger{background:var(--error);color:#2a0606}
.btn.block{display:block;width:100%;margin-top:10px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .card{width:100%;max-width:380px;padding:26px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:260px;display:flex;gap:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;gap:16px}@media(min-width:900px){.cols{grid-template-columns:1fr 340px;align-items:start}}
aside{display:grid;gap:14px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head h2{font:700 22px var(--display)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.chip{padding:7px 13px;border-radius:999px;background:var(--elev);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)}.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:8px}.row:hover{border-color:var(--accent)}
.row .t{width:78px;font-weight:700;font-size:13px}.t.buy{color:var(--success)}.t.sell{color:var(--accent)}.t.withdraw{color:var(--accent-soft)}
.row .m{flex:1;min-width:0}.row .m b{font-family:var(--display);font-size:14px}.row .m small{display:block;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}.success{background:rgba(52,211,153,.15);color:var(--success)}.failed{background:rgba(248,113,113,.15);color:var(--error)}.pending{background:rgba(184,199,255,.14);color:var(--accent-soft)}
.big{font:700 34px var(--display);margin:6px 0 12px}.big small{color:var(--primary);font-size:16px}
.kv{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:14px}.kv div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}.kv div:last-child{border:0}.kv span{color:var(--text2);flex:none}.kv b{text-align:right;word-break:break-all}
.link{color:var(--accent);background:none;padding:0;font-weight:700;text-decoration:underline}
.why{color:var(--error)}.empty{text-align:center;color:var(--text2);padding:30px}
.mdl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,20,.72);backdrop-filter:blur(6px)}
.mcard{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px}.mcard h3{font:700 20px var(--display);margin-bottom:8px}.mcard p{margin:8px 0;line-height:1.5;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.merr{color:var(--error);font-weight:600;font-size:14px;margin-top:8px}
.mbtns{display:flex;gap:10px;margin-top:16px}.mbtns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--elev);border:1px solid var(--border);padding:12px 18px;border-radius:14px;font-weight:600;z-index:70}.toast.bad{border-color:var(--error);color:var(--error)}
/* ===== motion: same language as the app (one curve, rise in, corner brackets lock on) ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes lockin{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}}
@keyframes popin{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}}
#main>*{animation:rise .38s var(--ease) backwards}
.btn,.chip,.row{transition:background-color .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease),transform .16s var(--ease)}
.btn:active,.row:active{transform:scale(.985)}
.btn:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn.ghost:hover{border-color:var(--accent);background:#1d2b42;box-shadow:none}
.btn.danger:hover{background:#ef5f5f}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.chip:hover{border-color:var(--primary);color:var(--text)}
.row:hover{border-color:var(--accent);background:var(--elev)}
/* popup: rises in and its two corner brackets lock on */
#mdl:not([hidden]){animation:rise .2s var(--ease)}
#mdl:not([hidden]) .mcard{animation:popin .32s var(--ease)}
.mcard{position:relative}
.mcard::before,.mcard::after{content:"";position:absolute;width:30px;height:30px;border:2px solid var(--primary);pointer-events:none;animation:lockin .4s .06s var(--ease) backwards}
.mcard::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:24px;--dx:-8px;--dy:-8px}
.mcard::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-bottom-right-radius:24px;border-color:var(--accent);--dx:8px;--dy:8px}
.mcard:has(.btn.danger)::before{border-color:var(--error)}.mcard:has(.btn.danger)::after{border-color:#FDA4AF}
.toast{animation:toastin .3s var(--ease)}
/* ===== Userbase ===== */
.ub-search{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.ub-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.ub-search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--text2);stroke-width:2;stroke-linecap:round;transition:stroke .16s var(--ease),transform .28s var(--ease)}
.ub-search:focus-within svg{stroke:var(--primary);transform:rotate(-12deg)}
.ub-search input{border:0;background:none;box-shadow:none!important;outline:0!important;padding:12px 0;flex:1;min-width:0}
.ub-search input::-webkit-search-cancel-button{display:none}
.ub-search kbd{font:600 11px var(--font);color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;cursor:pointer}
.ub-wrap{overflow-x:auto;overflow-y:hidden;margin-top:14px}
.ub-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ub-table th{text-align:left;padding:10px 14px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.ub-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background-color .16s var(--ease)}
.ub-table tbody tr{animation:rise .2s var(--ease) backwards;animation-delay:calc(var(--i,0)*15ms)}
.ub-table tbody tr:last-child td{border-bottom:0}
.ub-table tbody tr:hover td{background:var(--elev)}
.ub-table tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
#ubBody.busy{opacity:.5;transition:opacity .2s}
.ub-table mark{background:rgba(16,185,129,.22);color:var(--text);border-radius:3px;padding:0 1px}
.uid-link{color:var(--accent);background:none;padding:0;font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:13px;cursor:pointer;
 background-image:linear-gradient(currentColor,currentColor);background-size:0 1.5px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .28s var(--ease)}
.uid-link:hover{background-size:100% 1.5px}
.ub-why{display:block;color:var(--error);margin-top:4px;max-width:260px}
.ub-act{padding:7px 12px;font-size:12px}
.deact-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(248,113,113,.15);color:var(--error)}
.active-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(52,211,153,.15);color:var(--success)}
.ub-pages{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px;font-size:13px;color:var(--text2)}.ub-pages .btn{padding:8px 14px}
/* ===== Transaction log (UPI Randomness & Collection Control) ===== */
.upi-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.upi-add input{flex:1;min-width:220px}
.upi-grid{display:grid;gap:14px;margin-top:16px}@media(min-width:720px){.upi-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
.upi-card{position:relative;background:var(--elev);border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;gap:12px;animation:rise .22s var(--ease) backwards;animation-delay:calc(var(--i,0)*25ms);transition:border-color .16s var(--ease)}
.upi-card:hover{border-color:var(--accent)}
.upi-card.off{opacity:.68}
.upi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.upi-id{font:700 16px var(--display);word-break:break-all}
.upi-tot{font:700 28px var(--display);color:var(--success);margin:2px 0}.upi-tot small{font-size:13px;color:var(--text2);font-weight:600;margin-left:6px}
.upi-meta{display:grid;gap:6px;font-size:13px;padding-top:10px;border-top:1px dashed var(--border)}
.upi-meta div{display:flex;justify-content:space-between;gap:10px}.upi-meta span{color:var(--text2)}.upi-meta b{text-align:right}
.upi-btns{display:flex;gap:8px;flex-wrap:wrap}.upi-btns .btn{flex:1;padding:9px 12px;font-size:13px}.upi-btns .btn.sm{flex:0 0 auto}
/* ===== CashQR Queue ===== */
.cqr-list{display:grid;gap:12px;margin-top:14px}
.cqr-card{background:var(--elev);border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;gap:10px;animation:rise .22s var(--ease) backwards}
.cqr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cqr-acts{display:flex;gap:8px;flex-wrap:wrap}
.cqr-prev{width:176px;height:176px;margin:10px auto;background:#fff;border-radius:14px;padding:8px;display:grid;place-items:center}.cqr-prev svg,.cqr-prev img{width:100%;height:100%}
.cqr-box{margin-top:14px;padding:14px;border-radius:14px;background:var(--elev);border:1.5px solid var(--primary);display:grid;gap:10px}
/* ===== BSC Hot Wallet Payouts ===== */
.hw-grid{display:grid;gap:12px;margin-top:14px}@media(min-width:760px){.hw-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.hw-stat{background:var(--elev);border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;gap:4px}
.hw-stat b{font:700 20px var(--display)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login"><div class="card"><div class="brand"><span class="mark"></span>BlockNexa Admin</div>
  <p class="mut" style="margin:14px 0 12px">Enter your admin key to continue.</p>
  <input id="key" type="password" placeholder="Admin key" autocomplete="off" aria-label="Admin key">
  <p class="merr" id="lerr" role="alert"></p><button class="btn block" id="enter">Enter</button></div></div>
<div id="panel" hidden><div class="wrap">
  <div class="bar"><div class="brand"><span class="mark"></span>Admin</div>
    <form class="search" id="sf"><input id="q" placeholder="Search by Order ID (#A7K2M9), User ID, UTR, phone or email" aria-label="Search"><button class="btn">Search</button></form>
    <div class="nav"><button class="btn" id="nTrade" title="Turn Buy & Sell ON or OFF for all users">Buy &amp; Sell: ON</button><button class="btn ghost" id="nPending">Pending</button><button class="btn ghost" id="nPayouts">Payouts</button><button class="btn ghost" id="nCashQr">CashQR</button><button class="btn ghost" id="nUsers">Userbase</button><button class="btn ghost" id="nTxLog">Transaction log</button><button class="btn ghost" id="nNotifs">Notifications</button><button class="btn ghost" id="nAudit">Admin log</button><button class="btn ghost" id="nBackup">Backup</button><button class="btn ghost" id="nLock">Lock</button></div></div>
  <main id="main"><p class="empty">Search for a user or an order to begin, or open Pending.</p></main></div></div>
<div class="mdl" id="mdl" hidden><div class="mcard" id="mcard"></div></div>
<script src="jsQR.js?v=5"></script>
<script src="bn-admin.js?v=5"></script>
</body></html>
